name: close-linked-issues
# github only auto-closes issues when a pr merges into the *default* branch
# (main). vouch's integration branch is `test`, so every "fixes #n" in a pr
# targeting test is silently ignored and the issue stays open. this closes
# them explicitly on merge into test.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] metadata only — never checks out or runs pr code
    types: [closed]
    branches: [test]
permissions:
  issues: write
jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: close issues referenced by closing keywords
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          # github's own parser ignores closing keywords inside code, so a pr
          # that merely *discusses* "fixes #n" does not close #n. strip fenced
          # blocks and inline code spans first to match that behaviour — pr
          # #670 closed #652 off a quoted keyword in its own prose.
          #
          # the backtick arrives via printf rather than a literal: shellcheck
          # reads one inside any quoting as an expansion and fails the
          # actionlint gate with SC2016.
          bt=$(printf '\140')
          strip_code() {
            awk -v bt="$bt" '
              BEGIN {
                fence = "^[[:space:]]*(" bt bt bt "|~~~)"
                span = bt "[^" bt "]*" bt
              }
              $0 ~ fence { fenced = !fenced; next }
              !fenced { gsub(span, ""); print }
            '
          }
          # same keyword set github itself honours, same-repo #n refs only.
          nums=$(printf '%s\n%s\n' "$TITLE" "$BODY" \
            | strip_code \
            | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]*#[0-9]+' \
            | grep -oE '[0-9]+' \
            | sort -un || true)
          if [ -z "$nums" ]; then
            echo "no closing keywords in pr #$PR"; exit 0
          fi
          for n in $nums; do
            state=$(gh issue view "$n" --repo "$REPO" --json state --jq .state 2>/dev/null || true)
            if [ "$state" != "OPEN" ]; then
              echo "#$n: ${state:-not an issue} — skipping"; continue
            fi
            gh issue close "$n" --repo "$REPO" --reason completed \
              --comment "closed by #$PR, merged into \`test\`." \
              && echo "#$n: closed"
          done
